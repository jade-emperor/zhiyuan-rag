# CI：三件事，按"需要什么外部条件"分层
#
#   ① `contracts`  —— **零容器、零网络、零模型**：pyright + 30 套契约 + 29 份反向 runner。
#                     分组依据是实测（scripts/acceptance/run_all.py 的 docstring 记了探测方法），
#                     缺模型/语料的检查会 SKIP 并点名 owner，不是 FAIL。这一层是 required。
#                     59 份脚本单机要跑 30 分钟往上（反向 runner 每份都要绿的跑一遍、改坏源码再
#                     红的跑一遍），**贴着 job 的 timeout-minutes 上限** —— 撞上限时 GitHub 记
#                     `cancelled`，PR 上一个 ✗ 看着像代码坏了。所以拆成 3 片并行
#                     （`run_all.py --shard i/3`），每片 ~20 份脚本、9~13 分钟；pyright 只跑第 1 片。
#   ② `frontend`   —— 前端：typecheck + build + **断言产物与源码同源**（构建后 git diff 必须为空）。
#   ③ `services`   —— 夜间/手动：起真 Milvus/MySQL/Redis 后再跑那 5 套依赖真中间件的契约。
#                     需要真数据的 4 套（check_m2_faq / check_m5_qa / check_m5_stream /
#                     check_m4_rewrite_ab）**永不进 CI**
#                     —— 语料有版权、真 provider 调用花钱，见 run_all.py 的 LOCAL_ONLY。
#
# 本地跑同一份清单：`uv run python scripts/acceptance/run_all.py --set ci`（阈值与分组见 run_all.py）。
# 只想跑某一片（复现 CI 的红）：`... --set ci --shard 2/3`。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 20 * * 0" # 每周一 04:00（北京时间）跑一次含中间件的
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 配置里有三个必填项会 fail-fast：CI 用假值，保证"缺密钥"和"代码坏了"能分开
  RAG_LLM__DEEPSEEK_API_KEY: sk-ci-dummy
  RAG_MYSQL__PASSWORD: ci-dummy
  RAG_REDIS__PASSWORD: ci-dummy
  RAG_EMBEDDING__DEVICE: cpu

jobs:
  contracts:
    # 为什么拆片、为什么是 3 片：见文件头的注释。每片 ≈ 20 份脚本，实测验收 9~13 分钟；
    # uv sync 没命中缓存时要 8~17 分钟（三片同时冷启动会并发拉同一批 wheel），所以超时给到 45。
    name: 契约 + 反向测试（零容器零网络）${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 装 uv（版本与 Dockerfile / 本地一致）
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.11"
          enable-cache: true

      - name: 同步依赖（--locked：pyproject 与 uv.lock 不一致就当场失败）
        run: |
          # 三片同时冷启动会并发拉同一批 wheel,实测偶发一次下载失败(第 3 片那次跑了 7 分半才挂)。
          # 重试仍带 --locked:pyproject 与 uv.lock 真的不一致时**不能被重试混过去**,那是 fail-fast 的本意。
          for attempt in 1 2 3; do
            if uv sync --locked; then exit 0; fi
            echo "uv sync 第 ${attempt} 次失败"
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          echo "::error::uv sync 连续三次失败,见上面的输出"
          exit 1

      # 类型检查只跑一片：它是整树扫描，跟分片无关，跑三遍只是白烧三份时间
      - name: 类型检查
        if: matrix.shard == '1/3'
        run: uv run pyright src scripts

      - name: 验收（ci 集合第 ${{ matrix.shard }} 片：30 套契约 + 29 份反向 runner 分摊）
        run: |
          set -o pipefail
          uv run python scripts/acceptance/run_all.py --set ci --shard ${{ matrix.shard }} 2>&1 | tee acceptance.log

      # 公开仓库的 **job 日志要登录才看得到**（匿名访问 /logs 是 403），而下面这两处不用：
      # job summary 在运行页上、annotation 在 job 页上，都是公开的。失败时把不合格的脚本贴过去。
      - name: 把不合格的脚本贴到 job summary（失败时）
        if: failure()
        run: |
          {
            echo "### 第 ${{ matrix.shard }} 片不合格的脚本"
            echo '```'
            grep -E '^  ✘' acceptance.log || echo '(没有 ✘ 行：失败发生在验收之前，比如 sync)'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          grep -E '^  ✘' acceptance.log | while IFS= read -r line; do
            echo "::error title=验收不合格::$line"
          done || true

  frontend:
    name: 前端 typecheck + 产物与源码同源
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: 产物必须与源码同源（构建后不该有任何 diff）
        run: |
          if ! git diff --exit-code -- ../src/project_rag/api/static/app; then
            echo "::error::前端产物与源码不同源 —— 本地跑一次 \`cd web && npm run build\` 并把产物一起提交"
            exit 1
          fi

  services:
    name: 真中间件（夜间/手动）
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.11"
          enable-cache: true

      - run: uv sync --locked

      - name: 起中间件（用仓库自己的 compose，端口与本地一致）
        run: docker compose up -d standalone mysql redis

      - name: 等它们真的能应答（Milvus 起来要一两分钟）
        run: |
          for i in $(seq 1 40); do
            if uv run python scripts/acceptance/check_env_services.py > /tmp/probe.log 2>&1; then
              echo "中间件就绪（第 $i 次探测）"; exit 0
            fi
            sleep 10
          done
          echo "::error::中间件 10 分钟内没就绪"; tail -30 /tmp/probe.log; exit 1

      - name: 依赖真中间件的那几套
        run: uv run python scripts/acceptance/run_all.py --set services

      - name: 失败时留日志
        if: failure()
        run: docker compose logs --tail 80
