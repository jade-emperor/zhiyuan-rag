# =============================================================================
# 知源助手依赖 — 供 uv 使用
# 组合:Python 3.13 + LangChain 1.4 + 最新稳定版配套包
# 服务端不变:Milvus 2.4.4(gRPC 宿主 10086)+ Redis 7.2(宿主 10087,密码 1234)
# =============================================================================
# 用法:
#   uv python pin 3.13        # 锁定 Python 3.13
#   uv sync                   # 解析并安装,生成 uv.lock
#
# 说明:
#   - 全部用「范围约束」,让 uv 解析到互相兼容的最新稳定版;
#     各下界都是已确认支持 Python 3.13 的版本。
#   - pymilvus 客户端 >=2.5.7(与 Milvus 2.4.4 服务端兼容);
#     redis 客户端与 Redis 7.2 服务端兼容。
# =============================================================================

[project]
name = "project-rag"
version = "0.1.0"
description = "知源助手：面向企业知识资产的可溯源智能问答平台，支持精准溯源、混合检索与文档级权限隔离"
requires-python = ">=3.13,<3.14"
# 对外元数据（开源化补):在此之前只有 name/version/description ——
# PyPI 页面、依赖分析工具、以及"这个项目能不能用"的判断都拿不到这些信息。
license = "MIT"
license-files = ["LICENSE"]
# 只留名字,不留邮箱:邮箱是维护者的个人信息,打包元数据不是非它不可。
authors = [{ name = "The_Jade_Emperor" }]
readme = "README.md"
keywords = [
    "rag",
    "retrieval-augmented-generation",
    "vector-search",
    "bm25",
    "rerank",
    "milvus",
    "fastapi",
    "vue3",
    "chinese",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    # ---- LangChain 1.4 主线 ----
    "langchain>=1.4,<1.5",
    "langchain-core>=1.6,<2.0",
    "langchain-community>=0.4.1,<0.6",
    "langchain-ollama>=1.0,<2.0",
    "langchain-text-splitters>=1.1,<2.0",
    "langchain-chroma>=1.1,<2.0",
    "langchain-experimental>=0.4,<0.6",
    "langgraph>=1.0,<2.0",
    # ---- 向量库 / 检索(客户端,对应服务端 Milvus 2.4.4 / Redis 7.2)----
    "pymilvus>=2.5.7,<3.1",
    "milvus-model>=0.2.5",
    "chromadb>=1.5.4,<2.0",
    "faiss-cpu>=1.9.0",
    "rank-bm25>=0.2.2",
    "redis>=5.3.1,<9.0",
    # ---- 大模型 / 嵌入 / 本地推理 ----
    "ollama>=0.6.0,<1.0",
    "transformers>=4.52,<6.0",
    "sentence-transformers>=4.0",
    "FlagEmbedding>=1.3.5",
    "peft>=0.18",
    "modelscope>=1.23",
    "datasets>=3.3",
    "tiktoken>=0.7",
    "sentencepiece>=0.2",
    # ---- 文档解析 ----
    "python-docx>=1.1.2",
    "python-pptx>=1.0",
    "PyMuPDF>=1.25",
    "pillow>=10.4",
    "opencv-python>=4.10",
    "rapidocr-onnxruntime>=1.4",
    # ↑ pillow 用于登录/注册的图形验证码(captcha_image);cv2 / rapidocr 仍未进产品路径,是为
    #   「将来加扫描件」预留的;真要瘦身时它们可以搬进 optional,
    #   搬之前先确认没有传递依赖靠它们(卸载后跑一遍验收)。
    # ---- RAG 评估 ----
    "ragas>=0.3",
    # ---- 数据 / 通用工具 ----
    "pandas>=2.3",
    "numexpr>=2.11",
    "nltk>=3.9",
    "wikipedia>=1.4",
    "jieba>=0.42",
    "requests>=2.32.5,<3.0",
    "pymysql>=1.1.1",
    "addict>=2.4",
    "simplejson>=3.19",
    "sortedcontainers>=2.4",
    "markdown>=3.6",
    # ---- Web 服务 ----
    "fastapi>=0.115",
    "starlette>=0.46",
    "uvicorn>=0.30",
    "langchain-deepseek>=1.1.0",
    "langchain-openai>=1.6.1",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "pdfminer-six>=20260107",
    # ---- 图片模态 ----
    # 阿里云 OSS SDK。**延迟 import**:图片开关关掉时不付它的导入时间;
    # 它只负责对象上传/签名,不参与文本链路。
    "oss2>=2.19,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project_rag"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    # FastAPI 的 TestClient 依赖 httpx;验收脚本 import 它,所以显式声明
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/jade-emperor/zhiyuan-rag"
Repository = "https://github.com/jade-emperor/zhiyuan-rag"
Issues = "https://github.com/jade-emperor/zhiyuan-rag/issues"

[project.scripts]
# 构建映射,通过project-rag可以找到cli()函数
project-rag = "project_rag.cli.main:cli"
project-rag-api = "project_rag.api.app:run"
# 桌面壳。**壳里没有业务代码**:它只开一个窗口,后端地址由页面自己记。
project-rag-desktop = "project_rag.desktop:main"

# ---------------------------------------------------------------------------
# 可选依赖:不进运行时依赖,也不进镜像(`uv sync --no-dev` 不装 optional)。
# 只有桌面壳(`--extra desktop`)。
#
# **`unstructured` 那一档已整块删除**(连同 `en-core-web-sm`):它的 wheel 只有 GitHub
# 一个来源,而 uv 在**任何一次重新解析**(换机、改依赖、清缓存)时都要去取它 ——
# 实测取一次 172s,uv 默认 46s 放弃,于是 `uv run` / `docker build` 随机死在网络上。
# 而 `src/` 里 0 处 import 它(见 adapters/pdf_files.py、office_files.py 的说明),
# 为一个用不上的包赌构建可用性不划算。要用时自己 `uv add --optional unstructured`,
# 并先确认那个模型的来源可达。
# ---------------------------------------------------------------------------
[project.optional-dependencies]
# 桌面壳:pywebview 只在**开窗那一步**才 import(见 src/project_rag/desktop.py),
# 所以 `--help` / `--check` 在没有 GUI 栈的机器上照样能跑(CI 里就是这么验的)。
desktop = [
    "pywebview>=5.0",
]
