# =============================================================================
# RAG 项目依赖 — 供 uv 使用
# 组合:Python 3.13 + LangChain 1.4 + 最新稳定版配套包
# 服务端不变:Milvus 2.4.4(gRPC 宿主 10086)+ Redis 7.2(宿主 10087,密码 1234)
# =============================================================================
# 用法:
#   uv python pin 3.13        # 锁定 Python 3.13
#   uv sync                   # 解析并安装,生成 uv.lock
#
# 说明:
#   - 全部用「范围约束」,让 uv 解析到互相兼容的最新稳定版;
#     各下界都是已确认支持 Python 3.13 的版本。
#   - pymilvus 客户端 >=2.5.7(与 Milvus 2.4.4 服务端兼容);
#     redis 客户端与 Redis 7.2 服务端兼容。
# =============================================================================

[project]
name = "project-rag"
version = "0.1.0"
description = "课程知识库问答 RAG:FAQ 标准答案优先 + 混合检索(向量 + BM25)兜底,答案带引用、逐字流式、带延迟观测"
requires-python = ">=3.13,<3.14"
# 对外元数据（开源化补):在此之前只有 name/version/description ——
# PyPI 页面、依赖分析工具、以及"这个项目能不能用"的判断都拿不到这些信息。
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "The_Jade_Emperor", email = "The_Jade_Emperor@noreply.gitee.com" }]
readme = "README.md"
keywords = [
    "rag",
    "retrieval-augmented-generation",
    "vector-search",
    "bm25",
    "rerank",
    "milvus",
    "fastapi",
    "vue3",
    "chinese",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    # ---- LangChain 1.4 主线 ----
    "langchain>=1.4,<1.5",
    "langchain-core>=1.6,<2.0",
    "langchain-community>=0.4.1,<0.6",
    "langchain-ollama>=1.0,<2.0",
    "langchain-text-splitters>=1.1,<2.0",
    "langchain-chroma>=1.1,<2.0",
    "langchain-experimental>=0.4,<0.6",
    "langgraph>=1.0,<2.0",
    # ---- 向量库 / 检索(客户端,对应服务端 Milvus 2.4.4 / Redis 7.2)----
    "pymilvus>=2.5.7,<2.6",
    "milvus-model>=0.2.5",
    "chromadb>=1.5.4,<2.0",
    "faiss-cpu>=1.9.0",
    "rank-bm25>=0.2.2",
    "redis>=5.3.1,<7.0",
    # ---- 大模型 / 嵌入 / 本地推理 ----
    "ollama>=0.6.0,<1.0",
    "transformers>=4.52,<5.0",
    "sentence-transformers>=4.0",
    "FlagEmbedding>=1.3.5",
    "peft>=0.18",
    "modelscope>=1.23",
    "datasets>=3.3",
    "tiktoken>=0.7",
    "sentencepiece>=0.2",
    # ---- 文档解析 ----
    # 注意:unstructured 是**可选依赖**(见下方 [project.optional-dependencies]),不在运行时依赖里。
    "python-docx>=1.1.2",
    "python-pptx>=1.0",
    "PyMuPDF>=1.25",
    "pillow>=10.4",
    "opencv-python>=4.10",
    "rapidocr-onnxruntime>=1.4",
    # ↑ OCR 三件套(cv2 / rapidocr / pillow)目前产品路径一行没 import,是为
    #   「将来加扫描件」预留的;真要瘦身时它们和 unstructured 一样可以搬进 optional,
    #   搬之前先确认没有传递依赖靠它们(卸载后跑一遍验收)。
    # ---- RAG 评估 ----
    "ragas>=0.3",
    # ---- 数据 / 通用工具 ----
    "pandas>=2.3",
    "numexpr>=2.11",
    "nltk>=3.9",
    "wikipedia>=1.4",
    "jieba>=0.42",
    "requests>=2.32.5,<3.0",
    "pymysql>=1.1.1",
    "addict>=2.4",
    "simplejson>=3.19",
    "sortedcontainers>=2.4",
    "markdown>=3.6",
    # ---- Web 服务 ----
    "fastapi>=0.115",
    "starlette>=0.46",
    "uvicorn>=0.30",
    "langchain-deepseek>=1.1.0",
    "langchain-openai>=1.6.1",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "pdfminer-six>=20260107",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project_rag"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

# 静态元数据（加)——**别再删掉它**,删了就把下一条注释里那两次事故请回来。
#
# 为什么需要:那个 wheel 的 METADATA 里**只有 Name/Version**(实测:没有一条
# ``Requires-Dist`` / ``Requires-Python`` / ``Provides-Extra`` —— 它是纯数据包,
# 描述正文里那句 "spaCy >=3.8.0,<3.9.0" 只是表格文字,不是元数据字段),
# 所以可以如实静态声明。而 uv 解析时**即使没选中这个 extra 也要它的元数据**来校验锁 ——
# 那个 wheel 又只有 GitHub 一个来源(实测取一次:宿主 **172s**、容器 **186s**,
# 而 uv 默认 HTTP 超时 30s × 3 次重试 → **46s 就失败**)。于是它会随机死在这一步:
# * `docker build`（镜像构建第一次就死在这里,见 STATUS.md §0.3 第 38 条);
#   * **日常 `uv run project-rag-api`**(同一天第二次,报错一模一样)。
# 声明之后 uv 不必再去取它 —— 开发与构建都不再依赖 github。
# 维护:URL 里的版本(`en_core_web_sm-3.8.0`)与这里的 `version` 必须一致,
# 有契约盯着(`check_m6_deploy.py`「静态元数据」那条 + 反向 RT-19)。
[tool.uv]
dependency-metadata = [
    { name = "en-core-web-sm", version = "3.8.0" },
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    # FastAPI 的 TestClient 依赖 httpx;验收脚本 import 它,所以显式声明
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://gitee.com/The_Jade_Emperor/project_rag"
Repository = "https://gitee.com/The_Jade_Emperor/project_rag"
Issues = "https://gitee.com/The_Jade_Emperor/project_rag/issues"

[project.scripts]
# 构建映射,通过project-rag可以找到cli()函数
project-rag = "project_rag.cli.main:cli"
project-rag-api = "project_rag.api.app:run"
# 桌面壳(M7.4)。**壳里没有业务代码**:它只开一个窗口,后端地址由页面自己记。
project-rag-desktop = "project_rag.desktop:main"

# ---------------------------------------------------------------------------
# 可选依赖:不进运行时依赖,也就**不进镜像**(`uv sync --no-dev` 不装 optional)。
# 这三样是「第 4 个适配器」的备选 —— 加 HTML / Excel / 扫描件时才用得上
# (结论与实测数字见 docs/deferred.md §1.4)。
#
# 为什么必须搬出主依赖(两条都是实测,不是洁癖):
#   1) `en-core-web-sm` 的 wheel **只有 GitHub 一个来源**(见 [tool.uv.sources]),
#      留在主依赖里意味着每次 `uv sync --locked` 都要去 github.com 取一个
#      产品路径根本不用的模型 → 镜像构建会卡在这里(本机 `uv run` 曾卡满 90s 超时);
#   2) `src/` 里 **0 处** import unstructured —— 只有 4 处 docstring 在解释
#      「为什么不用它」(PDF 标题会从 551 条真书签变成 10883 条、慢 72 倍)。
#      留在主依赖里等于把一个整套解析栈塞进镜像,换来 0 收益。
#
# 要用时:`uv sync --extra unstructured`
# ---------------------------------------------------------------------------
[project.optional-dependencies]
# 桌面壳:pywebview 只在**开窗那一步**才 import(见 src/project_rag/desktop.py),
# 所以 `--help` / `--check` 在没有 GUI 栈的机器上照样能跑(CI 里就是这么验的)。
desktop = [
    "pywebview>=5.0",
]
unstructured = [
    "unstructured>=0.16,<1.0",
    "langchain-unstructured>=1.0,<2.0",
    "en-core-web-sm",
]
