<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>project-rag 知识库问答问答</title>
  <style>
    body { font-family: system-ui, "Microsoft YaHei", sans-serif; max-width: 46rem; margin: 3rem auto; padding: 0 1rem; }
    h1 { font-size: 1.25rem; }
    .hint { color: #666; font-size: .875rem; }
    #q { width: 32rem; padding: .4rem .6rem; font-size: 1rem; }
    button { padding: .4rem 1rem; font-size: 1rem; }
    #status { white-space: pre-wrap; color: #555; background: #fbfbfd; border-left: 3px solid #c9d1e0;
              padding: .6rem .8rem; margin-top: 1rem; min-height: 1.2rem; font-size: .875rem; }
    #out { white-space: pre-wrap; background: #f6f7f9; border: 1px solid #e3e5e8; border-radius: 6px;
           padding: .8rem; margin-top: .6rem; min-height: 4rem; }
  </style>
</head>
<body>
  <h1>知识库问答问答</h1>
  <p class="hint">FAQ 命中直答；否则走知识库（答案带引用）。依据一到就先列出来，答案再逐字出。</p>
  <div>
    <input id="q" placeholder="问点什么…（回车发送）" autofocus>
    <button id="send">发送</button>
  </div>
  <div id="status"></div>
  <div id="out"></div>

  <script>
    const out = document.getElementById('out');
    const status = document.getElementById('status');
    const input = document.getElementById('q');
    let socket = null;
    let evidence = '';      // 「已检索到 N 条依据」那几行
    let generating = false; // 还在等第一个字

    function lines(citations) {
      return citations.map(c => `  [${c.index}] ${c.source} ${c.doc_id} ${c.preview}…`).join('\n');
    }

    // 状态区与答案区分开渲染:依据先到就先显示 —— 用户在等首字的那几秒里不是盯着空白
    // (M5.6 实测:sources 帧 1.5s 到,第一个字 5s 到)
    function paintStatus() {
      status.textContent = evidence + (generating ? '\n（正在生成回答…）' : '');
    }

    function connect() {
      const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
      socket = new WebSocket(`${scheme}://${location.host}/api/stream`);
      socket.onmessage = (event) => {
        const frame = JSON.parse(event.data);
        if (frame.type === 'sources') {
          if (frame.citations && frame.citations.length) {
            evidence = `已检索到 ${frame.citations.length} 条依据：\n${lines(frame.citations)}\n`;
            generating = true;
            paintStatus();
          }
        } else if (frame.type === 'token') {
          if (generating) { generating = false; paintStatus(); }
          out.textContent += frame.text;
        } else if (frame.type === 'done') {
          if (generating) { generating = false; paintStatus(); }
          if (frame.citations && frame.citations.length && !evidence) {
            // 没收到过 sources 帧却带引用(FAQ 直答不检索):兜底渲染一次
            evidence = `依据 ${frame.citations.length} 条：\n${lines(frame.citations)}\n`;
            paintStatus();
          }
          if (frame.refused) out.textContent += '（拒答：没有检索到相关资料）';
          if (frame.truncated) out.textContent += '\n[注意] 回答被截断，不要当成完整答案';
        } else if (frame.type === 'error') {
          out.textContent += `\n[错误] ${frame.detail}`;
        }
      };
    }
    connect();

    async function send() {
      const query = input.value.trim();
      if (!query) return;
      input.value = '';
      out.textContent = '';
      evidence = '';
      generating = false;
      paintStatus();
      if (!socket || socket.readyState !== WebSocket.OPEN) {
        connect();
        await new Promise(resolve => setTimeout(resolve, 200));
      }
      socket.send(JSON.stringify({ query }));
    }

    document.getElementById('send').onclick = send;
    input.addEventListener('keydown', event => { if (event.key === 'Enter') send(); });
  </script>
</body>
</html>
