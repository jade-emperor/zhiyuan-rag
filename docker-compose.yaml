# 端口改造:
#   1) 宿主端口统一映射到 10086-10093,越常用越靠前:
#        10086 -> Milvus gRPC 19530   (最关键:SDK / Attu / 测试脚本都连这里)
#        10087 -> Redis 6379          (直接使用,密码 1234)
#        10088 -> Milvus HTTP 9091    (WebUI,偶尔用)
#        10089 -> MinIO S3 9000       (内部使用,基本不直接访问)
#        10090 -> MinIO 控制台 9001   (内部,基本不用)
#        10091 -> etcd 2379           (纯内部,基本不用)
#        10092 -> 3000                (后面加的可视化管理界面工具)
#        10093 -> MySQL 3306          (宿主 10093 -> 容器 3306)
#      容器内部端口(19530/6379/9091/9000/9001/2379)不变,组件间互连不受影响。
#   2) 关闭自启动:所有服务都不设 restart 策略(= no),Docker Desktop 启动时
#      不会自动拉起这些容器;只有手动 docker compose up -d 才启动,不抢内存。
#   3) 容器 / 网络 / 卷均跟随项目名:不写 container_name、不写网络名,Compose 会自动
#      按 <项目名>_<服务名> 命名,例如:
#        容器  rag_platform_standalone / rag_platform_redis / ...
#        网络  rag_platform_default
#        卷    rag_platform_etcd_data / rag_platform_milvus_data / ...
# =============================================================================
name: rag_platform

services:
  # ---------------------------------------------------------------------------
  # 1) etcd —— Milvus 的元数据存储
  # ---------------------------------------------------------------------------
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_ENABLE_V2=true            # Milvus 2.x 需要 v2 API,不要删
    ports:
      - "10091:2379"                   # 纯内部使用;可注释掉这行更安全
    volumes:
      - etcd_data:/etcd/data
    command: >-
      etcd
      -advertise-client-urls=http://etcd:2379
      -listen-client-urls http://0.0.0.0:2379
      --data-dir /etcd/data
    # 说明:文档原文 advertise 写的是 http://127.0.0.1:2379,在容器网络里 127.0.0.1
    # 指向 etcd 容器自身,standalone 可能连不上。这里改为服务名 etcd:2379。
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ---------------------------------------------------------------------------
  # 2) MinIO —— 对象存储,存索引文件和 binlog
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin     # 该版本 MinIO 仍用这两个旧变量名,保持与文档一致
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "10089:9000"                   # S3 API(内部使用)
      - "10090:9001"                   # Web 控制台(基本不用)
    volumes:
      - minio_data:/minio/data
    command: minio server /minio/data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ---------------------------------------------------------------------------
  # 3) Milvus standalone —— 向量库本体
  # ---------------------------------------------------------------------------
  standalone:
    image: milvusdb/milvus:v2.4.4
    command: ["milvus", "run", "standalone"]
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "10086:19530"                  # gRPC / SDK —— 最关键,直接用
      - "10088:9091"                   # HTTP / WebUI
    depends_on:
      - etcd
      - minio

  # ---------------------------------------------------------------------------
  # 4) Redis —— 缓存 / 会话记忆
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2                  # 固定为 7.2(BSD 协议,不随 latest 漂移到 8.x)
    restart: "no"                     # 不自启动(与其它服务一致)
    ports:
      - "10087:6379"                  # 直接使用(密码 1234)
    volumes:
      - redis_data:/data
    command: redis-server --requirepass 1234

  # ---------------------------------------------------------------------------
  # 5) MySQL —— FAQ 问答对等结构化数据
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0                 # 8.0 是长期维护线;要绝对确定可钉 mysql:8.0.43
    restart: "no"                    # 与其他服务一致:不随 Docker Desktop 自启
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-1234}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rag}
      MYSQL_USER: ${MYSQL_USER:-rag}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-1234}
      TZ: Asia/Shanghai
    ports:
      - "10093:3306"                 # 宿主 10093 -> 容器 3306
    volumes:
      - mysql_data:/var/lib/mysql
      # 想让容器首次启动自动建表/灌 FAQ:把 .sql 放进 ./docker/mysql/init/ 并打开下一行
      # - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    # 必须写成「列表」形式,不能写成一行字符串——见下方说明
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  # ---------------------------------------------------------------------------
  # 6) Attu —— Milvus 图形化管理界面(可选工具,可以考虑默认不启动)
  # ---------------------------------------------------------------------------
  attu:
    image: zilliz/attu:v2.4.9
    restart: "no"
    # profiles: ["tools"]              # 想让 Attu 随项目默认一起启动,注释掉这一行即可
    environment:
      - MILVUS_URL=standalone:19530  # 用服务名连 Milvus(在同一个网络里)
    ports:
      - "10092:3000"                 # 浏览器访问 http://localhost:10092
    depends_on:
      - standalone

  # ---------------------------------------------------------------------------
  # 7) mineru —— 独立 PDF 解析服务(图片模态开启时才需要)
  #
  # 它跟 app 分进程:解析一份 PDF 要几分钟,不能占着 Web 请求线程。
  # app 容器通过 http://mineru:8000 提交任务;宿主 CLI 通过 127.0.0.1:18082。
  mineru:
    # 图片模态是可选的:默认 `docker compose up` 不构建/启动它。
    # 要图片就 `docker compose --profile images up -d --build`(或单独 up mineru)。
    profiles: ["images"]
    build:
      context: ./services/mineru
      dockerfile: Dockerfile
    image: project-rag-mineru:0.1.0
    restart: "no"
    # `gpus: all` 与下面的 MINERU_DEVICE_MODE: cuda 必须成对:只写 cuda 不申请 GPU,
    # 容器里 torch.cuda.is_available() 是 False,MinerU 会静默退回 CPU(慢 10~30 倍)。
    gpus: all
    environment:
      MINERU_TOKEN: ${RAG_MINERU__TOKEN:-change-me}
      MINERU_OUTPUT_DIR: /data/mineru
      MINERU_WORKERS: "1"            # MinerU 吃 GPU/CPU,先单 worker;要并发自己量过再加
      MINERU_TIMEOUT_S: "3600"       # 大 PDF 在 CPU 上要几十分钟;客户端要 >= 这个值
      # 国内环境默认走 ModelScope;HuggingFace 在不少网络里连不上。
      # 想换回 HF 就改这里(或删掉,让代码默认 huggingface)。
      MINERU_MODEL_SOURCE: modelscope
      MINERU_DEVICE_MODE: cuda       # 与上面的 gpus 成对
      # 这是 16GB 卡,但 app 的嵌入/重排还占着 4~5GB;按 8GB 估算 batch,别把整卡算进去。
      MINERU_VIRTUAL_VRAM_SIZE: "8"

    ports:
      # 只绑回环给**宿主上的 CLI** 用;不暴露到局域网。
      # app 容器走 compose 服务名 http://mineru:8000,不经过这个映射。
      - "127.0.0.1:18082:8000"
    volumes:
      - mineru_cache:/data/mineru
      - mineru_models:/root/.cache   # 模型缓存:不挂的话每次重建镜像/容器都要重下

  # 8) app —— 服务本体(镜像由本仓库根目录的 Dockerfile 构建)
  #
  # 为什么放这里而不是让它在宿主上跑:中间件都在同一个 compose 网络里,地址直接写
  # 服务名(standalone / mysql / redis)、端口用**容器内部端口**(19530 / 3306 / 6379),
  # 不再是 `host.docker.internal` + 1008x/1009x 那一串宿主映射。
  # 只想起中间件(在宿主上 `uv run` 开发)时,指名道姓即可:
  #   docker compose up -d standalone mysql redis
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: project-rag:0.1.0            # 固定 tag:README 与 API.md 里的命令都按它写
    restart: "no"                       # 与其它服务一致:不随 Docker Desktop 自启
    env_file:
      - .env                            # LLM key / MySQL / Redis 密码
    gpus: all
    environment:
      # 覆盖 .env 里给「宿主上的服务」准备的那套地址 —— 容器里 127.0.0.1 是容器自己
      RAG_MILVUS__HOST: standalone
      RAG_MILVUS__PORT: "19530"
      RAG_MYSQL__HOST: mysql
      RAG_MYSQL__PORT: "3306"
      RAG_REDIS__HOST: redis
      RAG_REDIS__PORT: "6379"
      # app 容器里必须用 compose 服务名;宿主 CLI 用 127.0.0.1:18082
      RAG_MINERU__BASE_URL: http://mineru:8000
      # 与 mineru 服务的 MINERU_TIMEOUT_S 对齐:大 PDF 单份可能几十分钟。
      RAG_MINERU__TIMEOUT_S: "3600"
      RAG_EMBEDDING__DEVICE: cuda      # 与上面的 gpus 成对,别单独删;宿主侧脚本在 agent 沙箱里
                                        # 看不见 GPU(见 AGENTS.md),别据此判定"这台机器没有 GPU"
    ports:
      - "8080:8080"                     # 宿主 8080 被占就改左边;右边是容器内端口,不能改
                                        # 宿主上的**代码后端**是另一个口(18080,见 config/config.yaml)——
                                        # 两者可同时开:实时占用看 `./scripts/dev.sh ports`
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data:ro
      # 上传落盘目录**单独给一条可写 bind**:config.yaml 的 api.uploads_dir 就是 data/uploads,
      # 而它落在上面那条只读挂载里 —— 少了这一行,容器里的「上传文档」必然失败
      # (`_stream_to_file` 报 OSError [Errno 30] Read-only file system;
      #)。只开这一个写入口,语料其余部分仍然只读。
      # ⚠️ 宿主侧 `data/uploads` 必须先存在(README 的 quickstart 与 `./scripts/dev.sh up` 都会
      # `mkdir -p`):否则 Docker 会替你建一个 root 属主的目录,容器里的 uid 1000 写不进去。
      - ./data/uploads:/app/data/uploads
      # MinerU 结果的本地缓存(下载 zip 后解压到这里)。它在只读的 ./data 下面,
      # 必须单独给可写 bind;否则 app 下载完结果写不进缓存,每次重灌都要重跑 MinerU。
      - ./data/mineru:/app/data/mineru
      - ./logs:/app/logs                # 另一个需要写的挂载点(镜像里 /app/logs 属于 uid 1000)
    depends_on:
      standalone:
        condition: service_started      # standalone 没写 healthcheck,只能 service_started
      mysql:
        condition: service_healthy      # 首次启动要初始化数据目录(~30s),不等它会连不上
      redis:
        condition: service_started

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  redis_data:
  mysql_data:
  mineru_cache:
  mineru_models:
