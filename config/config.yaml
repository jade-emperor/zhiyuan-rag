env: dev
root_log_level: NOTSET # 根日志等级,这是第一道阀门,开发环境可以调整为DEBUG,生产环境要提高等级,或者将设置权力交给handler
console_log_level: INFO # 控制台日志等级
file_log_level: DEBUG # 文件日志等级,先通过root过滤,如果root设置为INFO,这里设置为DEBUG也不会写入DEBUG的日志
log_dir: logs
# 日志轮转:单个文件上限 + 保留几份旧日志(app.log.1 / .2 …)。
log_max_bytes: 10485760 # 10MB
log_backup_count: 5

api:
  # 启动预热:把嵌入/重排模型、语料索引、Milvus 连接先在启动阶段建好,
  # 免得第一个用户扛冷启动(实测:首个请求比热请求多付 4.4s)。
  # 只跑到「检索出引用」为止,不调大模型 → 不花 token 钱;失败不拦启动。
  warmup: true
  # 上传的原文件落盘目录(相对项目根)。删文档时会连它一起删,所以别指到语料目录外的地方。
  uploads_dir: data/uploads
  # 单个上传文件大小上限(MB):礼貌的闸,不是安全边界(防滥用靠反代/限流)。
  max_upload_mb: 50
  # 绑定地址:绑回环时 WSL 里 Windows 浏览器连不上(实测);进容器也映射不出去。
  host: 0.0.0.0
  # 端口分层(三个角色,别混;实时占用看 `./scripts/dev.sh ports`):
  #   18080 = **宿主上的代码后端**(裸跑 `uv run project-rag-api` 与 `./scripts/dev.sh serve` 都读这里):
  #           改完源码直接跑,不必重建镜像;与容器各占一个口,两个可以同时开。
  #   8080  = **容器里的 app**(交付形态)。镜像里 `ENV RAG_API__PORT=8080` 会盖住这一行,
  #           所以改这里不影响容器 —— 那条链由 Dockerfile 的 ENV==EXPOSE 与
  #           check_m6_deploy 的「端口分层」两条契约盯着。
  # ApiConfig 的**类默认值**仍是 8080:它是「连 yaml 都没有」时的兜底,而那种场景只有
  # 镜像里会发生(镜像里 yaml 与 ENV 都在),所以它跟镜像的口保持一致更安全
  # (check_m1_1_config 也钉着它)。
  port: 18080
  # 预热查询。**换语料领域时记得换这一句** —— 检索不到东西的预热等于没预热。
  warmup_query: "装饰器有什么用"
  # CORS 允许的来源。本机全开;对外必须收紧成具体域名。
  # "全开 + 绑非回环地址"这个组合启动时会打一条 WARNING(不拦启动)。
  cors_origins: ["*"]
  # 限流:**滑动窗口**(不是固定窗口,也不是令牌桶),计数默认在 Redis。
  #   每一档 <= 0 = 关掉这一档;backend: memory 可退到单进程(重启清零、多 worker 各算各的)。
  #   一分钟 60 次问答够任何人用,但挡住循环脚本;上传背后是几分钟 CPU 嵌入,所以更紧。
  #   实现:adapters/ratelimit_redis.py —— 一段 Lua 原子完成「裁剪→计数→判定→写入→设 TTL」,
  #   窗口时间取 **Redis 服务端时钟**(多机时钟不同步也不会各算各的窗口)。
  rate_limit:
    enabled: true
    # redis = 跨进程共享(重启不清零、多 worker 一份计数、时钟以 Redis 为准);
    # memory = 单进程内存(无 Redis 的部署与离线验收用)。Redis 故障时降级为**放行**并记告警。
    backend: redis
    key_prefix: "ratelimit:v1:"
    window_s: 60
    query: 60
    upload: 10
    login: 10

llm:
  model: deepseek-flash
  base_url: https://api.deepseek.com/v1
  # 思考模式(开关 + 强度一个变量搞定):
  #   auto         = 不发参数,沿用服务端默认(开启、high)—— 即加这个开关之前的行为
  #   off          = 不思考(最快):实测首个内容字 ~0.5s(思考时 2~15s)
  #   low / high / max = 开启并指定强度(deepseek-flash 支持 low/high/max,默认 high)
  # 注意:思考时 temperature 会被忽略(不报错也不生效);思考还会计入输出 token。
  thinking: "off"
  temperature: 0.7
  max_tokens: 4096
  timeout_s: 60.0

mysql:
  host: 127.0.0.1
  port: 10093
  user: rag
  database: rag
  connect_timeout_s: 5 # 连不上时多久报错(本机 Docker 与跨网部署合理值不同)

redis:
  host: 127.0.0.1
  port: 10087
  db: 0
  # Redis 故障时每个请求要等多久才降级(见 deferred.md §1.1「降级放大」)
  socket_timeout_s: 1.0

faq:
  # 口径 = top1 原始分 / 该条问自己的分
  # 0.85 = 只答近乎一字不差的问题;改写问法交给 RAG 通道
  threshold: 0.85
  table: faq

cache:
  # FAQ 答案缓存的过期秒数(旁路缓存)。
  # 300 = 5 分钟:够挡住重复提问那笔 LLM 兜底的钱,又不至于让过期答案停留太久。
  # 注意作用域:该缓存当前只服务 `faq` 单通道命令 —— 合流(qa / FastAPI)不读写缓存,
  # 见 docs/deferred.md #21。
  ttl_s: 300
  # BM25 索引「语料指纹」的缓存秒数:指纹查询实测 397.6ms/次(3938 块)且**每次检索都调**,
  # 而真正的 BM25 打分只要 ~1ms —— 缓存后每查询变成一次 Redis GET(~0.1ms)。
  # 代价只是「语料变了最多晚这么久被发现」;入库本身要几分钟,20 秒体感上不存在。
  # 要"上传完立刻可搜"就得让写入方 bump 缓存键(见 docs/deferred.md 第 56 条)。
  corpus_fp_ttl_s: 20

milvus:
  host: 127.0.0.1
  # 宿主端口,19530 映射到 10086
  port: 10086
  # 只准填已存在的库。Milvus 不会自动建库,当前环境里只有 default
  database: default
  collection: rag_chunks

embedding:
  # 目录相对项目根;写绝对路径也认
  model_dir: models/bge-m3
  # 重排模型,现在只把位置定下来
  rerank_model_dir: models/bge-reranker-v2-m3
  device: cuda
  use_f16: false
  # 嵌入实现:bge_m3(默认,真语义)| hashing(演示用,字符 bigram 哈希,**非语义**)。
  #   为什么留 hashing 这一档:让"没有 4.4G 模型"的机器也能跑通 ingest→search→界面
  #   (见 demo/README.md 的 5 分钟演示)。它**不是**语义模型,只按字面相似度检索,
  #   所以选它时启动日志里必定有一条 WARNING。
  #   ⚠️ 绝不能让"没模型"悄悄退回 hashing —— 那会让检索看起来正常、实际全是噪声,
  #   所以默认值被契约钉死(check_m3_rag「演示后端必须显式开启」+ 反向 RT-6)。
  backend: bge_m3

rag:
  # 分块与检索默认值
  parent_chunk_size: 1200
  child_chunk_size: 300
  chunk_overlap: 50
  # ingest 的嵌入批大小:CPU 上批量越大越划算,显存小的机器反而要调小。
  ingest_batch_size: 64
  # 2026-09-22 用评估集量过一次:5/2 vs 10/3(112 条,同一套 judge)。
  # 10/3 把 recall 从 0.9654 抬到 0.9844,但 precision 0.9732→0.9595、
  # faithfulness 0.9680→0.9491,四项均值 0.9347→0.9313 —— 花更多上下文买到更差的忠实度,
  # 所以**回到 5/2**。证据留档:docs/STATUS.md §0.5 与 data/README.md。
  retrieval_k: 5          # 每一路各召回多少条(BM25 路 / 向量路)
  candidate_m: 2          # 融合后最终进上下文的块数,也就是大模型收到的父块数量
  # 融合:两路(进程内 BM25 关键字 + Milvus 稠密向量)合并成一个排序。
  #   rrf      —— 只用排名,免标定,对两路分数量纲不敏感
  #   weighted —— 各自归一化后加权,能表达「哪一路更可信」,但要调权重
  # 两种都会实现,用 data/eval 的评估集选。
  fusion: rrf
  rrf_k: 60  # 各排名得分的分母,越大各排名的得分差距越小
  # 两路权重:rrf 模式=排名权重,weighted 模式=分数权重。至少一个 > 0。
  bm25_weight: 0.5
  vector_weight: 0.5
  # 重排:两路融合后,用 CrossEncoder 对**父块正文**再精排一次。
  #   顺序:召回 → 融合 → 折叠父块 → 重排 → 截断到 candidate_m
  rerank: true

conversation:
  # 会话历史:表名 + 保留轮数。
  # 读写共用 history_rounds:读最近 N 轮进提示词,写的时候把会话裁到最近 N 轮。
  table: conversations
  history_rounds: 5
