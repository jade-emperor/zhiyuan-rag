env: dev
root_log_level: NOTSET        # NOTSET / DEBUG / INFO / WARNING / ERROR
console_log_level: INFO
file_log_level: DEBUG
log_dir: logs
log_max_bytes: 10485760       # 单文件上限,字节
log_backup_count: 5

api:
  serve_frontend: true        # true = 后端托管前端产物;false = 只发 API
  warmup: true
  uploads_dir: data/uploads
  corpus_dir: data/corpus
  max_upload_mb: 50
  host: 0.0.0.0
  port: 18080
  threadpool_size: 50           # 同时在处理的请求上限(anyio 线程池)
  warmup_query: "装饰器有什么用"
  cors_origins: ["*"]         # * = 全开
  rate_limit:
    enabled: true
    backend: redis            # redis = 跨进程;memory = 单进程
    key_prefix: "ratelimit:v1:"
    window_s: 60
    query: 5                  # 每窗口次数上限,<= 0 = 关闭该档
    upload: 10
    login: 10
  captcha:
    enabled: true
    ttl_s: 120
    length: 4
  registration:
    enabled: true             # false = 关闭自助注册
    invite_code: ""           # 非空 = 注册需填邀请码
    min_password_chars: 10

llm:
  model: deepseek-flash
  base_url: https://api.deepseek.com/v1
  thinking: "off"             # auto / off / low / high / max
  temperature: 0.7
  max_tokens: 4096
  timeout_s: 60.0
  stream_usage: true          # false = 不向 provider 要 token 用量

cost:
  currency: CNY
  peak:
    weekdays: [1, 2, 3, 4, 5]      # ISO 星期:1=周一 … 7=周日
    windows:                        # 高峰时段,北京时间,左闭右开
      - ["09:00", "12:00"]
      - ["14:00", "18:00"]
  holidays:                         # 法定节假日,含头含尾
    - ["2025-01-01", "2025-01-01"]
    - ["2025-01-28", "2025-02-04"]
    - ["2025-04-04", "2025-04-06"]
    - ["2025-05-01", "2025-05-05"]
    - ["2025-05-31", "2025-06-02"]
    - ["2025-10-01", "2025-10-08"]
    - ["2026-01-01", "2026-01-03"]
    - ["2026-02-15", "2026-02-23"]
    - ["2026-04-04", "2026-04-06"]
    - ["2026-05-01", "2026-05-05"]
    - ["2026-06-19", "2026-06-21"]
    - ["2026-09-25", "2026-09-27"]
    - ["2026-10-01", "2026-10-07"]
  models:
    deepseek-flash: &v41_flash     # 单价:元 / 百万 token;键为 provider 回报的模型名
      input_cache_hit:  {peak: 0.04, off_peak: 0.02}
      input_cache_miss: {peak: 2.0,  off_peak: 1.0}
      output:           {peak: 8.0,  off_peak: 4.0}
    DeepSeek-V4.1-Flash: *v41_flash

mysql:
  host: 127.0.0.1
  port: 10093
  user: rag
  database: rag
  connect_timeout_s: 5

redis:
  host: 127.0.0.1
  port: 10087
  db: 0
  socket_timeout_s: 1.0

faq:
  threshold: 0.95               # top1 分 / 自身分,夹到 0~1
  min_query_coverage: 0.5       # 提问词被命中条目覆盖的比例
  min_entry_coverage: 0.8       # 条目词被提问覆盖的比例
  min_question_tokens: 2        # 数据准入:实词数下限,0 = 不校验
  min_question_chars: 8         # 数据准入:字数下限
  table: faq

cache:
  ttl_s: 300                    # FAQ 答案缓存秒数
  corpus_fp_ttl_s: 20           # BM25 语料指纹缓存秒数

milvus:
  host: 127.0.0.1
  port: 10086
  database: default
  collection: rag_chunks_img_v1
  read_consistency: bounded     # strong / bounded / eventually
  index:
    type: IVF_FLAT              # FLAT / IVF_FLAT
    nlist: 128                  # IVF_FLAT:簇数
    nprobe: 16                  # IVF_FLAT:检索探几个簇,<= nlist

images:
  enabled: false                # 真开走 .env 的 RAG_IMAGES__ENABLED
  max_per_doc: 50
  min_bytes: 2048
  max_bytes: 10485760
  allowed_types: image/jpeg,image/png,image/webp

oss:
  region: cn-guangzhou
  prefix: rag/images
  url_mode: signed              # signed / proxy
  sign_expires_s: 300
  connect_timeout_s: 5
  upload_timeout_s: 30
  max_retries: 3

mineru:
  base_url: http://mineru:8000
  timeout_s: 3600
  poll_interval_s: 2
  cache_dir: data/mineru

embedding:
  model_dir: models/bge-m3
  rerank_model_dir: models/bge-reranker-v2-m3
  device: cuda                  # cuda / cpu
  use_f16: true
  rerank_use_f16: true
  embed_batch_size: 32          # 单次前向条数
  embed_batch_max_texts: 64     # 单批调度上限
  rerank_batch_size: 32         # 单次前向前对数
  rerank_batch_max_pairs: 128   # 单批调度上限
  backend: bge_m3               # bge_m3 / hashing

keyword:
  backend: milvus               # milvus / memory
  bm25_k1: 1.5                  # 词频饱和
  bm25_b: 0.75                  # 长度归一

rag:
  parent_chunk_size: 1200
  child_chunk_size: 300
  chunk_overlap: 50
  ingest_batch_size: 64
  retrieval_k: 10               # 每路召回条数
  candidate_m: 3                # 最终进上下文的父块数
  fusion: rrf                   # rrf / weighted
  rrf_k: 60
  bm25_weight: 0.5              # 两路权重,至少一个 > 0
  vector_weight: 0.5
  rerank: true

rewrite:
  enabled: true                 # 开 / 关
  classifier: lora              # lora / rule
  adapter_dir: logs/lora/run1/lora_adapter
  model_dir: ""                 # 空 = 按 run_meta.json 找基座
  device: cuda                  # cuda / cpu
  max_length: 64                # 与训练一致
  max_subqueries: 3
  max_query_chars: 400
  confidence_threshold: 0.0     # 0 = 不做低置信回退

conversation:
  table: conversations
  history_rounds: 5
  history_max_chars: 12000
