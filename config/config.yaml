env: dev
root_log_level: NOTSET # 根日志等级,这是第一道阀门,开发环境可以调整为DEBUG,生产环境要提高等级,或者将设置权力交给handler
console_log_level: INFO # 控制台日志等级
file_log_level: DEBUG # 文件日志等级,先通过root过滤,如果root设置为INFO,这里设置为DEBUG也不会写入DEBUG的日志
log_dir: logs

llm:
  model: deepseek-flash
  base_url: https://api.deepseek.com/v1
  temperature: 0.7
  max_tokens: 4096
  timeout_s: 60.0

mysql:
  host: 127.0.0.1
  port: 10093
  user: rag
  database: rag

redis:
  host: 127.0.0.1
  port: 10087
  db: 0

faq:
  # 口径 = top1 原始分 / 该条问自己的分(见 adapters/matcher_bm25.py)
  # 0.85 = 只答近乎一字不差的问题;改写问法交给 RAG 通道
  threshold: 0.85
  table: faq